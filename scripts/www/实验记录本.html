/* ===== 手机端样式：大按钮、大字号、单手可点 ===== */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f2f4f7;
  --panel: #fff;
  --ink: #1f2329;
  --ink2: #5a6472;
  --ink3: #8a8f99;
  --line: #e2e5ea;
  --blue: #1f6feb;
  --green: #0f9d58;
  --red: #d03050;
  --amber: #d97706;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  overflow: hidden;
}

button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ===== 顶部 ===== */
.top {
  flex-shrink: 0;
  background: var(--blue);
  color: #fff;
  padding: 14px 18px calc(14px + env(safe-area-inset-top, 0px) * 0);
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
}
.top-title { font-size: 19px; font-weight: 600; }
.top-sub { font-size: 12px; opacity: .82; margin-top: 3px; }

/* ===== 内容区 ===== */
.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 12px 20px;
}

.pane { display: none; }
.pane.on { display: block; }

/* ===== 底部 Tab ===== */
.tabs {
  flex-shrink: 0;
  display: flex;
  background: #fff;
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 8px 0 6px;
  color: var(--ink3);
  cursor: pointer;
  user-select: none;
}
.tab.on { color: var(--blue); }
.tab .ico { font-size: 20px; line-height: 1.2; }
.tab .lbl { font-size: 11px; margin-top: 1px; }

/* ===== 卡片 section ===== */
.sec {
  background: var(--panel);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.sec-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 10px;
}

/* ===== 表单 ===== */
.fld { display: block; margin-bottom: 12px; }
.fld > span {
  display: block;
  font-size: 12.5px;
  color: var(--ink3);
  margin-bottom: 6px;
}
input[type=text], input[type=date], input[type=number], select, textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fafbfc;
  outline: none;
  font-size: 16px; /* 16px 防止 iOS 自动放大 */
}
input:focus, select:focus, textarea:focus {
  border-color: var(--blue);
  background: #fff;
}
textarea { resize: vertical; line-height: 1.5; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

/* ===== 模板 ===== */
.tpls { display: flex; flex-wrap: wrap; gap: 8px; }
.tpl {
  flex: 1 1 calc(50% - 8px);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fafbfc;
  cursor: pointer;
  min-width: 140px;
}
.tpl:active { background: #eef4ff; border-color: var(--blue); }
.tpl-n { font-size: 14px; font-weight: 600; }
.tpl-m { font-size: 12px; color: var(--ink3); margin-top: 3px; }

/* ===== 物料行 ===== */
.mat-row {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
  background: #fafbfc;
}
.mat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.mat-head .role {
  font-size: 12px;
  background: #e8f0fe;
  color: var(--blue);
  padding: 3px 9px;
  border-radius: 5px;
}
.mat-head .del {
  border: none;
  background: transparent;
  color: var(--red);
  font-size: 20px;
  line-height: 1;
  padding: 0 4px;
}
.mat-body {
  display: grid;
  grid-template-columns: 1fr 92px 34px;
  gap: 6px;
  align-items: center;
}
.mat-body .unit { font-size: 13px; color: var(--ink3); text-align: center; }

/* ===== 按钮 ===== */
.btn {
  width: 100%;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}
.btn:active { opacity: .85; }
.btn:disabled { background: #c5cbd4; }
.btn.big { padding: 16px; font-size: 17px; font-weight: 600; }
.btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
.btn.gray { background: #f2f4f7; color: var(--ink2); border: 1px solid var(--line); }
.btn.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
.btn.sm { padding: 8px 14px; font-size: 14px; width: auto; border-radius: 7px; }

.actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.actions .btn.gray { width: 100%; }

/* ===== 记录卡 ===== */
.rec {
  border-bottom: 1px solid var(--line);
  padding: 12px 0;
}
.rec:last-child { border-bottom: none; }
.rec-head { display: flex; justify-content: space-between; font-size: 13px; }
.rec-sys { color: var(--blue); font-weight: 600; }
.rec-date { color: var(--ink3); }
.rec-t { font-size: 15px; margin: 5px 0 4px; }
.rec-m { font-size: 12.5px; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.rec-ops { display: flex; gap: 8px; margin-top: 9px; }

.tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11.5px;
  background: #eef2f7;
  color: var(--ink2);
}
.tag.ok { background: #e6f7ee; color: var(--green); }
.tag.warn { background: #fff4e5; color: var(--amber); }
.tag.bad { background: #fdecef; color: var(--red); }

.muted { color: var(--ink3); }
.small { font-size: 13px; }
.mono { font-family: Consolas, monospace; }

/* ===== 复制兜底层 ===== */
.fallback {
  position: fixed;
  inset: 0;
  background: rgba(20,26,35,.5);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.fallback.show { display: flex; }
.fb-box {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  width: 100%;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
}
.fb-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.fb-name { font-size: 12px; color: var(--ink3); margin-bottom: 10px; word-break: break-all; }
.fb-box textarea {
  flex: 1;
  min-height: 200px;
  font-family: Consolas, monospace;
  font-size: 12px;
  margin-bottom: 12px;
}

/* ===== Toast ===== */
#toast {
  position: fixed;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%) translateY(12px);
  background: #232b38;
  color: #fff;
  padding: 11px 20px;
  border-radius: 20px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 200;
  max-width: 86%;
  text-align: center;
  line-height: 1.5;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--red); }
#toast.ok { background: var(--green); }

/* ===== 大屏（平板）微调 ===== */
@media (min-width: 600px) {
  .content { max-width: 620px; margin: 0 auto; width: 100%; }
  .tpls .tpl { flex-basis: calc(33.33% - 8px); }
}

/* ===================== 通用常量 ===================== */
const UNITS = ['g', 'mg', 'mL', 'L', '片', '张', '个', '套', 'kg'];
const EXP_TYPES = ['配方', '合成', '组装', '测试', '表征', '对照', '验证', '重复'];
const STATUSES = ['完成', '失败', '进行中'];
const RESULT_TAGS = ['达标', '未达标', '待测', '异常'];

/* ===================== 便捷方法 ===================== */

function getSystem(id) {
  return SYSTEMS.find((s) => s.id === id) || null;
}

function systemName(id) {
  const s = getSystem(id);
  return s ? s.name : (id || '');
}

function materialsOfSystem(systemId) {
  const s = getSystem(systemId);
  return s ? s.materials : [];
}

function templatesOfSystem(systemId) {
  const s = getSystem(systemId);
  return s ? s.templates : [];
}

/** 生成物料代号前缀：体系码 + 用途，如 LILT-POS */
function suggestMaterialCode(roleId, systemId) {
  const sys = getSystem(systemId);
  const sysPrefix = sys ? sys.code.replace(/-/g, '') : 'GEN';
  return `${sysPrefix}-${(roleId || 'oth').toUpperCase()}`;
}

/**
 * 预设物料的确定性代号。
 * 关键：手机端和内网电脑端必须用【同一套规则】算出同一个代号，
 * 否则同一种料在两边会被当成两种，导入时无法自动对应。
 *
 * 规则：体系码(去横线) + "-" + 用途大写 + 两位序号
 * 例：LI-LT 体系第 3 个正极 → LILT-POS03
 */
function presetMaterialCode(systemId, index, roleId) {
  const sys = getSystem(systemId);
  const sysPrefix = sys ? sys.code.replace(/-/g, '') : 'GEN';
  return `${sysPrefix}-${(roleId || 'oth').toUpperCase()}${String(index + 1).padStart(2, '0')}`;
}

/** 把某体系的预设物料展开成带代号的对象数组 */
function expandSystemMaterials(systemId) {
  const sys = getSystem(systemId);
  if (!sys) return [];
  return sys.materials.map((m, i) => ({
    ...m,
    code: presetMaterialCode(systemId, i, m.role),
    system: systemId,
    stock: 0,
    safetyStock: 0,
    status: '启用'
  }));
}

/** 按代号查预设物料（跨所有体系） */
function findPresetMaterial(code) {
  for (const sys of SYSTEMS) {
    const hit = expandSystemMaterials(sys.id).find((m) => m.code === code);
    if (hit) return hit;
  }
  return null;
}

/** 统计：给自检和文档用 */
function presetStats() {
  const perSystem = SYSTEMS.map((s) => ({
    id: s.id,
    name: s.name,
    materials: s.materials.length,
    templates: s.templates.length,
    needsReview: s.materials.filter((m) => m.needsReview).length
      + s.templates.filter((t) => t.needsReview).length
  }));
  return {
    systems: SYSTEMS.length,
    materials: perSystem.reduce((a, b) => a + b.materials, 0),
    templates: perSystem.reduce((a, b) => a + b.templates, 0),
    needsReview: perSystem.reduce((a, b) => a + b.needsReview, 0),
    perSystem
  };
}

<script>
(function () {
"use strict";
/**
 * 手机端记录 App（离线）
 *
 * 定位：只在手机上"记"，不管库存、不做汇总。
 *   手机记录 → 导出文件 → 内网导入终端/U盘 → 内网电脑「导入记录」时统一扣库存
 *
 * 为什么手机不扣库存：
 *   1) 手机上没有可信的库存数据，各记各的必然对不上；
 *   2) 库存是"实验室的账"，应该由内网那台机器统一管；
 *   3) 手机断网也能用，不需要实时同步。
 *
 * 数据类型：全部存 localStorage，导出时打包成 lab.notebook.v1 格式，
 * 与内网电脑端完全兼容，内网导入时能自动去重并扣库存。
 */

/* ===================== 基础工具 ===================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function store(key, val) {
  if (val === undefined) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { console.error(e); }
  return val;
}

function uid() {
  try {
    if (window.crypto && window.crypto.getRandomValues) {
      const b = new Uint8Array(16);
      window.crypto.getRandomValues(b);
      return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* 降级 */ }
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function today() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function fmtTime(v) {
  const d = new Date(v);
  if (isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function r3(n) { return Math.round((Number(n) || 0) * 1000) / 1000; }

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 2600);
}

/* ===================== 本机状态 ===================== */

const App = {
  me: null,          // { empNo, name, system }
  records: [],       // 本机所有记录
  draft: null,       // 正在编辑的记录

  load() {
    this.me = store('pn_me') || null;
    this.records = store('pn_records') || [];
  },

  saveMe(me) {
    this.me = me;
    store('pn_me', me);
  },

  saveRecords() {
    store('pn_records', this.records);
  },

  /** 把一条记录存入本机（同 uid 覆盖） */
  upsert(rec) {
    const i = this.records.findIndex((x) => x.uid === rec.uid);
    if (i >= 0) this.records[i] = rec;
    else this.records.unshift(rec);
    this.records.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    this.saveRecords();
  },

  /** 待导出的记录（还没有导出过的） */
  pending() {
    return this.records.filter((r) => !r.exported);
  }
};

/* ===================== 页面切换 ===================== */

let currentTab = 'new';

function showTab(name) {
  currentTab = name;
  $$('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === name));
  $$('.pane').forEach((p) => p.classList.toggle('on', p.id === 'pane-' + name));
  if (name === 'new') renderNew();
  if (name === 'list') renderList();
  if (name === 'me') renderMe();
}

/* ===================== 新建记录 ===================== */

/**
 * 编辑中的记录（草稿）
 * { uid, date, system, project, type, steps, status, resultTag, notes, materials: [{code, alias, qty, unit}] }
 */
function newDraft() {
  return {
    uid: uid(),
    date: today(),
    system: (App.me && App.me.system) || 'LI-LT',

    type: '测试',
    steps: '',

}

      <div class="tpls">

  // 模板
  $$('.tpl', pane).forEach((node) => {
    node.addEventListener('click', () => {
      const t = tpls.find((x) => x.id === node.dataset.tpl);

      App.draft.type = t.type;

}

/** 按模板的用途分类，预先建好空白物料行 */
function materialRowsForTemplate(t, systemId) {
  return (t.roles || []).map((role) => ({ role, code: '', alias: '', qty: '', unit: '' }));
}

function renderMatList() {
  const box = $('#matList');
  if (!box) return;
  const d = App.draft;

  if (!d.materials.length) {
    box.innerHTML = '<div class="muted small" style="padding:6px 0">还没有料。选上面的模板会自动列出需要准备的分类。</div>';
    return;
  }

  box.innerHTML = '';
  d.materials.forEach((row, i) => {

  });

  box.querySelectorAll('[data-code]').forEach((sel) => {
    sel.addEventListener('change', (e) => {

      const code = e.target.value;

      d.materials[i].code = code;
      d.materials[i].alias = mat ? mat.alias : '';
      d.materials[i].unit = mat ? mat.unit : '';
      renderMatList();
    });
  });

  box.querySelectorAll('[data-qty]').forEach((inp) => {
    inp.addEventListener('input', (e) => {

/**
 * 从预设物料库找物料。
 * 手机上没有"实际库存"概念，物料库只是"可选清单"；
 * 有没有货由内网电脑核对。代号规则与电脑端完全一致（presetMaterialCode），
 * 这样导入时能自动对应上。
 */
function findMaterial(code, systemId) {
  return expandSystemMaterials(systemId).find((m) => m.code === code) || null;
}

function materialsForRole(roleId, systemId) {
  return expandSystemMaterials(systemId).filter((m) => !roleId || m.role === roleId);
}

function saveDraft() {
  const d = App.draft;
  if (!d.date) return toast('请选择日期', 'err');
  const mats = d.materials.filter((m) => m.code && Number(m.qty) > 0);
  if (!mats.length) return toast('请至少填写一种料的用量', 'err');

  const rec = {
    ...d,
    materials: mats.map((m) => ({
      code: m.code, alias: m.alias, qty: r3(m.qty), unit: m.unit
    })),
    savedAt: new Date().toISOString(),
    exported: false
  };
  App.upsert(rec);
  App.draft = newDraft();
  renderNew();
  toast('已保存到手机，记得导出', 'ok');
}

/* ===================== 记录列表 / 导出 ===================== */

function renderList() {

      App.records = App.records.filter((x) => x.uid !== b.dataset.del);
      App.saveRecords();

}

function exportRecords() {
  const pending = App.pending();
  if (!pending.length) return toast('没有待导出的记录', 'err');

  const payload = {
    schema: 'lab.notebook.v1',
    from: 'phone',
    exported_at: new Date().toISOString(),
    operator: {
      empNo: App.me.empNo,
      name: App.me.name,
      system: App.me.system || ''
    },
    experiments: pending.map((r) => ({
      uid: r.uid,
      revision: r.revision || 1,
      expCode: r.expCode || '',        // 手机不生成正式编号，内网导入时补
      date: r.date,
      system: r.system,
      project: r.project || '',
      type: r.type,
      status: r.status,
      resultTag: r.resultTag,
      materials: r.materials || [],
      steps: r.steps || '',
      notes: r.notes || ''
    }))
  };

  const text = JSON.stringify(payload, null, 2);
  const fname = `待传记录_${App.me.empNo}_${stamp()}.json`;

  downloadOrShare(text, fname, () => {
    // 标记为已导出
    pending.forEach((r) => { r.exported = true; r.exportedAt = new Date().toISOString(); });
    App.saveRecords();
    renderList();
    toast(`已导出 ${pending.length} 条，请传到内网`, 'ok');
  });
}

function stamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

/**
 * 手机上导出文件的方式，按环境尝试：
 *   1) 支持文件系统访问 API → 弹保存框
 *   2) 普通浏览器/WebView → a[download]
 *   3) 微信内打开 → 提示用浏览器打开
 */
function downloadOrShare(text, filename, onDone) {
  const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
  if (isWeChat) {
    toast('微信里不能保存文件，请点右上角用浏览器打开', 'err');
    return;
  }

  try {
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 150);
    if (onDone) onDone();
  } catch (e) {
    // 极老环境：退化成可全选复制
    showTextFallback(text, filename);
  }
}

/** 兜底：把内容显示出来，让用户自己复制或截图 */
function showTextFallback(text, filename) {
  const box = $('#fallback');
  $('#fallbackName').textContent = filename;
  $('#fallbackText').value = text;
  box.classList.add('show');
}

    const all = App.records;
    const payload = {
      schema: 'lab.notebook.v1',
      from: 'phone',
      exported_at: new Date().toISOString(),
      operator: { empNo: App.me.empNo, name: App.me.name, system: App.me.system || '' },
      experiments: all.map((r) => ({
        uid: r.uid, revision: r.revision || 1, expCode: r.expCode || '',
        date: r.date, system: r.system, project: r.project || '', type: r.type,
        status: r.status, resultTag: r.resultTag, materials: r.materials || [],
        steps: r.steps || '', notes: r.notes || ''
      }))
    };
    downloadOrShare(JSON.stringify(payload, null, 2),
      `全部记录_${App.me.empNo}_${stamp()}.json`, () => toast('已导出全部记录', 'ok'));
  });

  $('#btnClearAll').addEventListener('click', () => {
    if (!confirm('清空本机全部记录？导出的文件不受影响，但本机将不再保留副本。')) return;
    App.records = [];
    App.saveRecords();
    renderMe();
    toast('已清空');
  });
}

/* ===================== 启动 ===================== */

document.addEventListener('DOMContentLoaded', () => {
  App.load();

  $$('.tab').forEach((t) => {
    t.addEventListener('click', () => showTab(t.dataset.tab));
  });

  $('#fallbackClose').addEventListener('click', () => {
    $('#fallback').classList.remove('show');
  });

  // 首次使用强制填身份
  if (!App.me || !App.me.empNo) {
    showTab('me');
    toast('请先填写工号和姓名');
    return;
  }

  showTab('new');
});

})();
</script>
</body>
</html>
